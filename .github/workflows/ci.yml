name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify vendored vocabulary hash
        run: echo "60a44f00db0daafcad3a4e11fe8fcbb2821e1ca7879302bae413b212a0c1e8e7  contracts/vendored/vocabulary.yaml" | sha256sum -c -

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Unit and architecture tests
        run: dotnet test -c Release --no-build --filter "Category!=Integration"

      - name: Full suite (includes Testcontainers integration tests)
        run: dotnet test -c Release --no-build

      - name: Vulnerable package gate
        shell: bash
        run: |
          set -euo pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "Vulnerable packages found" >&2
            exit 1
          fi
          projects=$(grep -c "The given project" vulnerable.txt || true)
          clean=$(grep -c "has no vulnerable packages" vulnerable.txt || true)
          if [ "$projects" = "0" ] || [ -z "$projects" ] || [ "$projects" != "$clean" ]; then
            echo "Vulnerability report incomplete or unrecognized" >&2
            exit 1
          fi
