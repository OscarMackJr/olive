name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify vendored vocabulary hash
        run: echo "60a44f00db0daafcad3a4e11fe8fcbb2821e1ca7879302bae413b212a0c1e8e7  contracts/vendored/vocabulary.yaml" | sha256sum -c -

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Unit and architecture tests
        run: dotnet test -c Release --no-build --filter "Category!=Integration"

      - name: Full suite (includes Testcontainers integration tests)
        run: dotnet test -c Release --no-build

      - name: Vulnerable package gate
        shell: bash
        run: |
          set -euo pipefail
          expected=$(dotnet sln Olive.sln list | grep -c '\.csproj$' || true)
          set +e
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          code=${PIPESTATUS[0]}
          set -e
          bash build/vulnerable-gate.sh vulnerable.txt "$expected" "$code"
