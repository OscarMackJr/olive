# Fiskroad program shared vocabulary — machine-readable form.
# Owning spec: fiskroad/specs/PROGRAM_SHARED_VOCABULARY_v0.4.md
# This file is the comparison target for cross-repo conformance checks.
# Consuming repos vendor it unchanged and record its SHA-256.
version: 0.4

# ---- carried forward from v0.3, unchanged ----

data_classes:
  # Ordered least -> most restricted. Exact strings; no synonyms.
  - public
  - internal
  - confidential-personal
  - regulated-financial
  - regulated-identifier

# Classes no model may declare as approved_max_data_class.
unapprovable:
  - regulated-identifier

# Lowercase canonical UUID (8-4-4-4-12). Applies to every stored, logged,
# or transmitted tenant_id in the program, including gateway metadata.
tenant_id_format: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'

# POC tenants. Minted once, 2026-08-02; permanent. Display names are
# labels only and never travel as identifiers.
poc_tenants:
  - display_name: TENANT_ALPHA
    tenant_id: 5325ffe9-5727-4d88-9832-aebabb8d0538
  - display_name: TENANT_BETA
    tenant_id: f92c9dba-50f1-4cad-9690-5d79f8ded335
  - display_name: TENANT_GAMMA
    tenant_id: 8d61d9c2-e603-439b-8322-996c3099d503

# ---- new at v0.4 ----

# Why data is being accessed. Orthogonal to data_classes:
# data class limits WHICH MODELS may see data; purpose limits WHICH DATA
# may be seen at all. No default — undeclared purpose is a validation error.
purposes:
  - servicing
  - origination
  - collections
  - analytics
  - marketing
  - compliance-review
  - internal-support

# Purposes that may never receive unmasked individual-level records of the
# listed classes. The one hard-coded pairing rule; everything else is config.
purpose_class_prohibitions:
  - purpose: analytics
    prohibited_classes: [regulated-financial, regulated-identifier]
  - purpose: marketing
    prohibited_classes: [regulated-financial, regulated-identifier]

# Who or what is acting. An agent is neither its user nor its application.
principal_types:
  - user
  - application
  - agent

# Agent principals: on_behalf_of is mandatory and may not itself be an agent.
# Effective permissions are the INTERSECTION with on_behalf_of, never the union.
agent_delegation:
  on_behalf_of_required: true
  onward_delegation_permitted: false
  permission_model: intersection

# Action lifecycle outcomes. refused_policy (system declined before a human
# saw it) is deliberately distinct from rejected (a human declined).
action_outcomes:
  - proposed
  - refused_policy
  - awaiting_approval
  - approved
  - rejected
  - executed
  - execution_failed
  - expired

action_id_format: '^[a-z0-9_.]+@[0-9]+$'
